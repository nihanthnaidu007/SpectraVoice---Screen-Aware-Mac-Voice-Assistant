mode: terminal
debug: false
voice:
  tts_voice: shimmer
  whisper_model: base
  language: en
  speech_rate: 1.0
screen:
  quality: 80
  scale_factor: 0.8
  refresh_interval: 0.2
  cache_duration: 1.0
llm:
  provider: auto
  cloud_model: gpt-5
  ollama_url: http://localhost:11434
  ollama_model: llama3.2
  max_tokens: 800
  temperature: 0.7
  timeout: 60
  enable_vision: true
  enable_tools: true
api:
  openai_model: gpt-5
  max_tokens: 800
  temperature: 0.7
  timeout: 30
  max_retries: 3
hotkeys:
  mute_toggle: cmd+shift+m
  push_to_talk: space
  pause_resume: cmd+shift+p
  quit: cmd+shift+q
  dictation_mode: cmd+shift+d
  meeting_toggle: cmd+shift+e
logging:
  level: INFO
  file: logs/assistant.log
  max_size_mb: 10
  backup_count: 5
  format: '%(asctime)s [%(levelname)s] %(name)s - %(message)s'
safety:
  dry_run: false
  block_dangerous_commands: true
  require_confirmation: false
barge_in:
  enabled: true
  min_confidence: 0.4
  min_words: 1
  min_chars: 3
microphone:
  input_device: null
  energy_threshold: 5000
  dynamic_energy_threshold: false
  pause_threshold: 0.8
  ambient_noise_seconds: 1.0
  inline_transcription: false
tts:
  output_device: null
  hd_quality: true
supervisor:
  enabled: true
  max_restarts: 5
  window_seconds: 60
  backoff_seconds: 1
  backoff_max_seconds: 30
dictation:
  enabled: true
  activation: push_to_talk
  style: standard
  app_styles:
    terminal: minimal
    iterm: minimal
    iterm2: minimal
  filler_removal: true
  filler_words:
  - um
  - uh
  - er
  - ah
  - hmm
  - like
  - you know
  - i mean
  - sort of
  - kind of
  snippets:
    period: .
    comma: ','
    question mark: '?'
    exclamation mark: '!'
    colon: ':'
    semicolon: ;
    open paren: (
    close paren: )
    new line: '

      '
    new paragraph: '


      '
  vad_silence_timeout: 1.2
  insert_enter: false
  persist_audio: false
  audio_dir: ''
  retention_hours: 0
meeting:
  enabled: false
  language: english
  queue_depth: 256
  persist_audio: false
  audio_dir: ''
  retention_hours: 0
  summarizer: local
  cloud_consent: false
  chunk_chars: 6000
history:
  export_dir: ''
  cloud_qa_consent: false
modes:
  terminal:
    screen_quality: 80
    screen_scale: 0.8
    whisper_model: base
    max_tokens: 800
  gui:
    screen_quality: 80
    screen_scale: 0.8
    whisper_model: base
    max_tokens: 800
  minimal:
    screen_quality: 60
    screen_scale: 0.6
    whisper_model: tiny
    max_tokens: 300
